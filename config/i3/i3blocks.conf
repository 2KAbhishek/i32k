# Modernized i3blocks configuration file for i3bar
# BWnB Palette & Interactive Modules

# Global properties
separator=false
separator_block_width=12
markup=pango

[menu]
command=$HOME/.config/i3/scripts/blocks/menu.sh
interval=once

[cpu]
command=$HOME/.config/i3/scripts/blocks/cpu.sh
interval=5

[memory]
command=$HOME/.config/i3/scripts/blocks/memory.sh
interval=5

[disk]
command=$HOME/.config/i3/scripts/blocks/disk.sh
interval=30

[network]
command=$HOME/.config/i3/scripts/blocks/network.sh
interval=10

[volume]
command=$HOME/.config/i3/scripts/blocks/volume.sh
interval=once
signal=10

[battery]
command=$HOME/.config/i3/scripts/blocks/battery.sh
interval=30

[clock]
command=$HOME/.config/i3/scripts/blocks/clock.sh
interval=10
