# Backend
# GLX backend provides hardware-accelerated rendering and eliminates screen tearing.
backend = "glx";

# VSync
# Enforces vertical synchronization to eliminate tearing.
vsync = true;

# Performance & Rendering Optimizations
use-damage = true;
xrender-sync-fence = true;

# Shadows (Disabled for instant rendering & clean tiling aesthetic)
shadow = false;

# Fading & Animations (Disabled completely for maximum snappiness)
fading = false;
fade-in-step = 1.0;
fade-out-step = 1.0;
fade-delta = 0;

# Blur & Rounded Corners (Disabled for zero GPU overhead)
corner-radius = 0;
blur-background = false;

# Window Type Settings
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
};
